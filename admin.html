<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin concours 10 ans — Boxing Center</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="/src/styles/index.css" />
</head>
<body class="admin-body">
<header class="top">
  <img class="logo" src="/img/logo-bc-centre-blanc-520.png" width="140" height="46" alt="Boxing Center" />
  <strong class="admin-tag">Admin concours</strong>
</header>

<section class="admin" id="login">
  <h1>Tableau de suivi</h1>
  <form id="login-form">
    <label>Jeton admin
      <input type="password" id="token" autocomplete="current-password" required />
    </label>
    <button class="btn" type="submit">Ouvrir</button>
    <p class="form-error" id="login-error" hidden></p>
  </form>
</section>

<section class="admin" id="dash" hidden>
  <div class="kpis" id="kpis"></div>
  <form class="filters" id="filters">
    <label>Statut
      <select name="status">
        <option value="">Tous</option>
        <option value="inscrit">Inscrit</option>
        <option value="invite">Invité</option>
        <option value="inscription_finalisee">Inscription finalisée</option>
        <option value="numero_invalide">Numéro invalide</option>
        <option value="doublon">Doublon</option>
      </select>
    </label>
    <label>Source
      <input name="source" placeholder="story, meta, wa…" />
    </label>
    <label>Du
      <input type="date" name="from" />
    </label>
    <label>Au
      <input type="date" name="to" />
    </label>
    <button class="btn btn-ghost" type="submit">Filtrer</button>
    <a class="btn btn-ghost" id="export" href="#">Export CSV</a>
  </form>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Nom</th>
          <th>Tél</th>
          <th>Rôle</th>
          <th>Statut</th>
          <th>WhatsApp</th>
          <th>Source</th>
          <th>Générés</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</section>
<script type="module" src="/src/js/admin.js"></script>
</body>
</html>
